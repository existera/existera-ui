name: Security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production and development dependencies
        run: |
          mkdir -p work/security
          npm run --silent test:security -- --json > work/security/audit.json
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: work/security/audit.json
          retention-days: 7
